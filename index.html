
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Smart Event Dashboard</h1>
    <div id="AddEventContainer">
        <h2>Add New Event</h2>
        <form action="">
            <label for="eventName">Event Name:</label>
            <input type="text" id="eventName" name="eventName" required>
            <br><br>
            <label for="eventDate">Date:</label>
            <input type="date" id="eventDate" name="eventDate" required>
            <br><br>
            <label for="eventCategory">Category:</label>
            <select name="eventCategory" id="eventCategory">
                <option value="conference">Conference</option>
                <option value="workshop">Workshop</option>
                <option value="webinar">Webinar</option>
                <option value="meetup">Meetup</option>
                <option value="social">Social</option>
            </select>
            <br><br>
            <label for="eventDescription">Description:</label>
            <textarea id="eventDescription" name="eventDescription"></textarea>
            <br><br>
            <button type="submit">Add Event</button>
        </form>
    </div>
    <div>
        <h2>My Events</h2>
        <br>
        <button id="clearEvent">Clear All Events</button>
        <button id="addSample">Add Sample Events</button>
        <div id="allEventContainer">
            Events will be displayed here.
        </div>
    </div>




    <script >
    
let form = document.querySelector('form');
let eventTitle = document.querySelector('#eventName');
let eventDate = document.querySelector('#eventDate');
let eventCategory = document.querySelector('#eventCategory');
let eventDescription = document.querySelector('#eventDescription');
let allEventContainer = document.querySelector('#allEventContainer');

function addEventfunction(event) {
  event.preventDefault();
  let card = document.createElement('div');
  card.innerHTML = `<button>X</button>
                        <h4>${eventTitle.value}</h4>
                        <span>${eventDate.value}</span><br>
                        <span>${eventCategory.value}</span>
                        <p>${eventDescription.value}</p>`;
  allEventContainer.append(card);
  form.reset();
}
form.addEventListener('submit', addEventfunction);
function clearAllEventFUnction() {
    allEventContainer.innerHTML = '<h3>No Events Yet</h3>';
}
form.addEventListener('submit', addEventfunction);
document.querySelector('#clearEvent').addEventListener('click', clearAllEventFUnction);

</script>
</body>

</html>
